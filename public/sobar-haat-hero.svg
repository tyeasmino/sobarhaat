      <stop offset=".78" stop-color="#8FC9AC"/>
      <stop offset="1" stop-color="#F7C79C"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(1230 280) rotate(90) scale(360)" gradientUnits="userSpaceOnUse">
